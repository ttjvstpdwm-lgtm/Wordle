    // Filtra solo parole della lunghezza esatta
    function getWordsForLen(len) {
      const list = (WORDS[len] || []).filter(w => w.replace(/[^A-Z]/gi,"").length === len);
      return list.map(w => w.toUpperCase().replace(/[^A-Z]/g,"")).filter(w => w.length === len);

      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],

    const TILE_BG = { correct: "#1D9E75", present: "#BA7517", absent: "#888780" };
    const KEY_BG  = { correct: "#1D9E75", present: "#BA7517", absent: "#B4B2A9" };
    function evalGuess(guess, target) {
      const res = Array(guess.length).fill("absent");
      const tArr = target.split("");
      const used = Array(target.length).fill(false);
      guess.split("").forEach((l, i) => {
        if (l === tArr[i]) { res[i] = "correct"; used[i] = true; }
      });
      guess.split("").forEach((l, i) => {
        if (res[i] === "correct") return;
        const j = tArr.findIndex((tl, ti) => tl === l && !used[ti]);
        if (j !== -1) { res[i] = "present"; used[j] = true; }
      });
      return res;
    }

    function calcScore(attemptNumber, maxAttempts) {
      return Math.max(1, maxAttempts + 1 - attemptNumber);
    }

    function pickRevealLetter(target, evals) {
      const correct = new Set();
      evals.forEach(ev => ev.forEach((s, i) => { if (s === "correct") correct.add(i); }));
      const candidates = target.split("").map((l, i) => ({ letter: l, index: i })).filter(x => !correct.has(x.index));
      if (!candidates.length) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function pickFixLetter(target, guesses, evals) {
      const correct = new Set();
      evals.forEach(ev => ev.forEach((s, i) => { if (s === "correct") correct.add(i); }));
      const presentLetters = [];
      evals.forEach((ev, gi) => {
        ev.forEach((s, ci) => {
          if (s === "present") {
            const letter = guesses[gi][ci];
            const correctIdx = target.split("").findIndex((tl, ti) => tl === letter && !correct.has(ti));
            if (correctIdx !== -1) presentLetters.push({ letter, correctIdx });
          }
        });
      });
      if (!presentLetters.length) return null;
      return presentLetters[Math.floor(Math.random() * presentLetters.length)];
    }

      try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
    }

      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

        if (!allWords.length) { setMsg("Nessuna parola disponibile per questa lunghezza."); return; }

        const usedWords = getStorage(`wordle_used_${len}`) || [];
        const available = allWords.filter(w => !usedWords.includes(w));
        const pool = available.length > 0 ? available : allWords; // reset se finite

        const word = pool[Math.floor(Math.random() * pool.length)];

        setTarget(word);

        if (curr.length !== len) {
          setMsg(`Inserisci ${len} lettere`);
          setShake(true); setTimeout(() => setShake(false), 400);
          return;
        }
        const ev = evalGuess(curr, target);
        const newGuesses = [...guesses, curr];
        const newEvals = [...evals, ev];
        setGuesses(newGuesses); setEvals(newEvals); setCurr(""); setMsg(""); setHint(null);
        const newKeys = { ...keys };
        curr.split("").forEach((l, i) => {
          const s = ev[i];
          if (!newKeys[l] || (newKeys[l] === "absent" && s !== "absent") || s === "correct") newKeys[l] = s;
        });
        setKeys(newKeys);
        if (curr === target) {
          const base = calcScore(newGuesses.length, maxAttempts);
          const score = Math.max(0, base - penalties);
          setLastScore({ score, base, penalties });
          const newTotal = totalScore + score;
          setTotalScore(newTotal);
          setStorage("wordle_total_score", newTotal);
          setPhase("won");
        } else if (newGuesses.length >= maxAttempts) {
          setPhase("lost");
        }
      }, [curr, target, len, guesses, evals, keys, maxAttempts, totalScore, penalties]);

                padding: "9px 28px", borderRadius: 8, border: "none",
                background: "#1D9E75", color: "#fff", fontWeight: 600, fontSize: 14, cursor: "pointer"
              }}>Inizia partita</button>
              {msg && <p style={{ color: "#c00", marginTop: 10, fontSize: 13 }}>{msg}</p>}
            </div>
          )}

          {(phase === "playing" || phase === "won" || phase === "lost") && (
            <>
              <p style={{ textAlign: "center", fontSize: 12, color: "#aaa", margin: "0 0 10px" }}>
                Tentativo {Math.min(guesses.length + 1, maxAttempts)} di {maxAttempts}
              </p>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5, marginBottom: 14 }}>
                {grid.map((row, r) => (
                  <div key={r} style={{ display: "flex", gap: 5, animation: shake && r === guesses.length ? "shake 0.4s" : "none" }}>
                    {row.letters.map((l, c) => {
                      const isHinted = hint && !row.ev && r === guesses.length && c === hint.index;
                      const bg  = row.ev ? TILE_BG[row.ev[c]] : isHinted ? (hint.type === "fix" ? "#BA7517" : "#1D9E75") : "#fff";
                      const bdr = row.ev ? `2px solid ${TILE_BG[row.ev[c]]}` : isHinted ? `2px solid ${hint.type === "fix" ? "#BA7517" : "#1D9E75"}` : l ? "2px solid #999" : "2px solid #ccc";
                      const col = row.ev ? "#fff" : isHinted ? "#fff" : "#333";
                      return (
                        <div key={c} style={{
                          width: ts, height: ts, display: "flex", alignItems: "center", justifyContent: "center",
                          fontSize: fs, fontWeight: 700, borderRadius: 4,
                          background: bg, border: bdr, color: col, transition: "background 0.2s"
                        }}>{isHinted ? hint.letter : l}</div>
                      );
                    })}
                  </div>
                ))}
              </div>

              {msg && <p style={{ textAlign: "center", color: "#BA7517", fontSize: 13, margin: "0 0 8px" }}>{msg}</p>}

              {phase === "playing" && (
                <div style={{ textAlign: "center", marginBottom: 14 }}>
                  <div style={{ display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap" }}>
                    <button onClick={showRevealHint} style={{
                      fontSize: 12, padding: "6px 14px", borderRadius: 6,
                      border: "1px solid #1D9E75", background: "#E1F5EE", color: "#085041", cursor: "pointer"
                    }}>💡 Rivela lettera <span style={{color:"#c0392b",fontSize:10}}>-1pt</span></button>
                    <button onClick={showFixHint} disabled={!hasPresentLetters} style={{
                      fontSize: 12, padding: "6px 14px", borderRadius: 6,
                      border: hasPresentLetters ? "1px solid #BA7517" : "1px solid #ccc",
                      background: hasPresentLetters ? "#FDF3E3" : "#f0f0f0",
                      color: hasPresentLetters ? "#7A4A00" : "#aaa",
                      cursor: hasPresentLetters ? "pointer" : "not-allowed"
                    }}>🔀 Metti al posto giusto <span style={{color:"#c0392b",fontSize:10}}>-1pt</span></button>
                  </div>
                  {hint?.type === "reveal" && <p style={{ fontSize: 13, color: "#1D9E75", margin: "8px 0 0", fontWeight: 500 }}>La lettera <strong>{hint.letter}</strong> è in posizione {hint.index + 1}</p>}
                  {hint?.type === "fix" && <p style={{ fontSize: 13, color: "#BA7517", margin: "8px 0 0", fontWeight: 500 }}>La lettera <strong>{hint.letter}</strong> va in posizione {hint.index + 1}</p>}
                  {penalties > 0 && <p style={{ fontSize: 11, color: "#c0392b", margin: "6px 0 0" }}>Penalità accumulata: -{penalties} {penalties === 1 ? "punto" : "punti"}</p>}
                </div>
              )}

              {(phase === "won" || phase === "lost") && (
                <div style={{ textAlign: "center", padding: "12px 16px", marginBottom: 12, background: "#f9f9f9", borderRadius: 10, border: "1px solid #eee" }}>
                  {phase === "won" && lastScore !== null && (
                    <div style={{ marginBottom: 8 }}>
                      <span style={{ fontSize: 22 }}>{scoreLabel(lastScore.score)}</span>
                      <div style={{ marginTop: 4 }}>
                        <span style={{ fontSize: 26, fontWeight: 700, color: "#1D9E75" }}>+{lastScore.score}</span>
                        <span style={{ fontSize: 13, color: "#888", marginLeft: 6 }}>punti • Totale: {totalScore}</span>
                      </div>
                      {lastScore.penalties > 0 && (
                        <p style={{ fontSize: 12, color: "#c0392b", margin: "3px 0 0" }}>(base {lastScore.base} − {lastScore.penalties} di penalità)</p>
                      )}
                      <p style={{ fontSize: 13, color: "#555", margin: "4px 0 0" }}>Indovinato al tentativo {guesses.length} su {maxAttempts}</p>
                    </div>
                  )}
                  {phase === "lost" && (
                    <p style={{ fontWeight: 600, fontSize: 15, margin: "0 0 8px", color: "#993C1D" }}>
                      La parola era: <strong>{target}</strong>
                    </p>
                  )}
                  <button onClick={() => setPhase("setup")} style={{
                    marginTop: 8, padding: "7px 22px", borderRadius: 8, border: "none",
                    background: "#1D9E75", color: "#fff", fontWeight: 600, fontSize: 13, cursor: "pointer"
                  }}>Nuova partita</button>
                </div>
              )}

              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
                {KEY_ROWS.map((row, ri) => (
                  <div key={ri} style={{ display: "flex", gap: 4 }}>
                    {row.map(k => {
                      const st = keys[k];
                      return (
                        <button key={k} onClick={() => handleKey(k)} style={{
                          minWidth: (k === "ENTER" || k === "BACK") ? 50 : 30, height: 40, borderRadius: 4,
                          border: "none", background: st ? KEY_BG[st] : "#e0e0e0",
                          color: st ? "#fff" : "#333", fontWeight: 600,
                          fontSize: (k === "ENTER" || k === "BACK") ? 20 : 30,
                          cursor: "pointer", padding: "0 2px"
                        }}>{k === "BACK" ? "⌫" : k}</button>
                      );
                    })}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
